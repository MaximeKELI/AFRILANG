name: afriblock
description: AFRIBLOCK — IDE desktop Flutter pour AFRILANG (workbench v0.1).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  file_picker: ^8.1.7
  path: ^1.9.1
